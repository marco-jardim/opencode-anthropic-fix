name = "sync-watcher"
main = "src/index.mjs"
compatibility_date = "2025-09-01"

# Cron disabled. The watcher's patcher (src/delivery.mjs) regex-rewrites the
# FALLBACK_CLAUDE_CLI_VERSION and CLI_TO_SDK_VERSION literals in index.mjs. The
# wire-compat migration removed those literals from this repo — they live in
# @tormentalabs/claude-code-wire-compat now — so scheduled runs match nothing and
# open silent no-op PRs. Re-enable once the patcher is re-pointed at the package.
[triggers]
crons = []

[[kv_namespaces]]
binding = "UPSTREAM_KV"
id = "bfc51187f2014042a882e6d6764c9cc7"
preview_id = "52ba223f45f54354b50b2e5247c2f1a6"

[ai]
binding = "AI"

[vars]
GITHUB_REPO = "marco-jardim/opencode-anthropic-fix"
NPM_PACKAGE = "@anthropic-ai/claude-code"
AI_MODEL = "@cf/moonshotai/kimi-k2.5"
LOG_LEVEL = "info"

# Secrets (set via wrangler secret put):
# GITHUB_TOKEN
