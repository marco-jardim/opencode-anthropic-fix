name: Publish to npm

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Version bump type"
        required: false
        default: "patch"
  push:
    branches:
      - master
    paths:
      - package.json

permissions:
  id-token: write
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 2

      - name: Check if version changed
        id: version_check
        shell: bash
        run: |
          set -euo pipefail
          PREV=$(git show HEAD~1:package.json 2>/dev/null | node -p "JSON.parse(require('fs').readFileSync('/dev/stdin','utf8')).version" 2>/dev/null || echo "")
          CURR=$(node -p "require('./package.json').version")
          echo "prev=$PREV"
          echo "curr=$CURR"
          if [ "$PREV" = "$CURR" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        if: steps.version_check.outputs.changed == 'true' || github.event_name == 'workflow_dispatch'
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          cache: npm

      - name: Install dependencies
        if: steps.version_check.outputs.changed == 'true' || github.event_name == 'workflow_dispatch'
        run: npm ci

      - name: Lint
        if: steps.version_check.outputs.changed == 'true' || github.event_name == 'workflow_dispatch'
        run: npm run lint

      - name: Check invariants
        if: steps.version_check.outputs.changed == 'true' || github.event_name == 'workflow_dispatch'
        run: npm run check:invariants

      - name: Test
        if: steps.version_check.outputs.changed == 'true' || github.event_name == 'workflow_dispatch'
        run: npm test

      - name: Build
        if: steps.version_check.outputs.changed == 'true' || github.event_name == 'workflow_dispatch'
        run: npm run build

      - name: Publish package
        if: steps.version_check.outputs.changed == 'true' || github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          set -euo pipefail
          version=$(node -p "require('./package.json').version")
          if [[ -z "$version" || "$version" == "undefined" || "$version" == "null" ]]; then
            echo "Could not parse package version" >&2
            exit 1
          fi
          if [[ "$version" == *-* ]]; then
            npm publish --access public --tag beta
          else
            npm publish --access public --tag latest
          fi
        env:
          NPM_CONFIG_PROVENANCE: true
